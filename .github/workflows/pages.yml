name: Build and publish game
on:
  push:
    branches: [main]
    paths: ['game/**', 'scripts/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/4.5.1-stable
          curl --fail --location --retry 3 "$base/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          curl --fail --location --retry 3 "$base/Godot_v4.5.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' -d /tmp/godot
          mkdir -p ~/.local/share/godot/export_templates/4.5.1.stable
          cp /tmp/godot/templates/web_nothreads_*.zip ~/.local/share/godot/export_templates/4.5.1.stable/
      - name: Import and export game
        run: |
          /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path game --editor --import
          python3 scripts/export_web.py /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          test -s web/index.wasm
          test -s web/index.pck
      - name: Verify progression, saves and mobile layout
        shell: bash
        run: |
          set -euo pipefail
          python3 game/tests/validate_level3.py
          python3 game/tests/validate_level4.py
          python3 game/tests/validate_level5.py
          python3 game/tests/validate_level6.py
          python3 game/tests/validate_level7.py
          python3 game/tests/validate_level8.py
          python3 game/tests/validate_level9.py
          python3 game/tests/validate_level10.py
          python3 game/tests/validate_chapter3.py
          python3 game/tests/validate_shortcuts.py
          for test in verify_v03 verify_level2 verify_level3 verify_level4 verify_level5 verify_level6 verify_level7 verify_level8 verify_level9 verify_level10 verify_chapter3 verify_comfort verify_localization verify_shortcuts verify_chapter_polish verify_mobile_performance verify_audio_transitions; do
            XDG_DATA_HOME="$RUNNER_TEMP/lab-$test" /tmp/godot/Godot_v4.5.1-stable_linux.x86_64 --headless --path game --fixed-fps 60 --script "res://tests/$test.gd" 2>&1 | tee "$RUNNER_TEMP/$test.log"
            if grep -E "SCRIPT ERROR:|^ERROR:" "$RUNNER_TEMP/$test.log"; then exit 1; fi
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
